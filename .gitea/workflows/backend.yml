# NFR-05 / T-02 -- the smoke test is only worth writing if it runs without
# anyone remembering to run it.
#
# Three jobs, cheapest first: Go unit tests, the Python self-checks that survive
# the port, then the end-to-end smoke test against a real API and a real
# inference sidecar.
name: backend

on:
  push:
    paths: ["backend/**", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**", ".github/workflows/backend.yml"]
  workflow_dispatch:

jobs:
  # Everything in Go, including the cross-language golden vectors: if this fails
  # the port has diverged from the behaviour it was held to.
  go:
    runs-on: ubuntu-latest
    services:
      # internal/store's tests run against a real PostgreSQL, because the
      # invariant they protect (append-only class indices under concurrency) is
      # a property of row locking that no mock can have.
      db:
        image: postgres:16-alpine
        env: { POSTGRES_DB: labeltool, POSTGRES_USER: labeltool, POSTGRES_PASSWORD: labeltool }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U labeltool" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://labeltool:labeltool@localhost:5432/labeltool
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.26", cache: true, cache-dependency-path: backend/go.sum }
      - name: go vet
        working-directory: backend
        run: go vet ./...
      # gofmt is not advisory here: a formatting-only diff in a later PR buries
      # the change that PR is actually about.
      - name: gofmt
        working-directory: backend
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "not gofmt'd:"; echo "$unformatted"; exit 1
          fi
      - name: go test
        working-directory: backend
        run: go test ./... -count=1
      - name: go build
        working-directory: backend
        run: go build ./...

  # What is left of the Python: the inference sidecar's own checks, plus the one
  # golden-vector file whose producer still exists (see backend/tests/gen_testdata.py).
  python:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16-alpine
        env: { POSTGRES_DB: labeltool, POSTGRES_USER: labeltool, POSTGRES_PASSWORD: labeltool }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U labeltool" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://labeltool:labeltool@localhost:5432/labeltool
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      # No torch: none of these load a model.
      - run: pip install -r backend/tests/requirements.txt
      - run: python -m backend.inference.models
      - run: python -m backend.tools.metrics
      - run: python -m backend.tools.groundtruth
      - run: python -m backend.tests.dbcheck
      # If this fails, tools/metrics.py moved without internal/core/metrics
      # moving with it -- and the readiness number the whole tool turns on now
      # depends on which implementation you asked.
      - run: python -m backend.tests.gen_testdata --check

  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [go, python]
    services:
      db:
        image: postgres:16-alpine
        env: { POSTGRES_DB: labeltool, POSTGRES_USER: labeltool, POSTGRES_PASSWORD: labeltool }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U labeltool" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      # inference/models.py and internal/platform/models both resolve checkpoints against
      # this exact directory -- the cache path and the download destination below
      # have to agree with it, or `available` reads false after a successful
      # download.
      MODELS_DIR: ${{ github.workspace }}/models
      MODELS_CATALOG: ${{ github.workspace }}/backend/models.json
      SCHEMA_PATH: ${{ github.workspace }}/backend/db/schema.sql
      # Path confinement is unconditional since T-27 -- there is no longer a
      # "local" mode that switched it off. The fixtures the harness sends as
      # input_dir live under the checkout, so that is the root here; the default
      # (/opt/mount/project) would 403 every request in this job.
      LABEL_TOOL_VM_ROOT: ${{ github.workspace }}
      DATABASE_URL: postgresql://labeltool:labeltool@localhost:5432/labeltool
      VPE_URL: http://127.0.0.1:8001
      YOLO_CONFIG_DIR: /tmp
      MPLCONFIGDIR: /tmp
      # Small enough that the harness exercises the upload size cap for real
      # instead of skipping it.
      LABEL_TOOL_MAX_UPLOAD_MB: "1"
      # T-28. Signing in is mandatory (T-27), so the API will not start without
      # this -- but the reason to have it is older: the smoke test's whole auth
      # block was gated on the target server having users configured, and this
      # workflow never configured any. It has been skipped on every run since it
      # was written, which is how its assertions drifted out of date unnoticed.
      #
      # Local accounts rather than OIDC on purpose: covering the gate needs a
      # credential, not an identity provider, and standing up a mock OIDC server
      # in CI to avoid a password hash that is public by design is work spent to
      # test the harness instead of the app.
      LABEL_TOOL_SECRET: ci-not-a-secret-the-server-is-thrown-away
      # alice / hunter2, the smoke test's defaults, plus a second account so
      # FR-49's "someone else holds this image" path is exercised by two
      # different subjects rather than one account in two sessions. Produced by
      # `api -hash-password <name> <password>`; nothing to protect here.
      LABEL_TOOL_USERS: "alice:pbkdf2$240000$4c398f4699ba3d06b917574a26c0abec$f625c92f5f7e1f01749b4697fb23e8de2eee8ebc1f4421e753df2fd58b1ae86a,bob:pbkdf2$240000$471e7215e8f992e564067f8054e86c52$43dc573204ac5576bc7387cf0931dbfcc3e26335ce50950131336d74277b0924"
      SMOKE_USER: alice
      SMOKE_PASSWORD: hunter2
      SMOKE_USER2: bob
      SMOKE_PASSWORD2: hunter2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.26", cache: true, cache-dependency-path: backend/go.sum }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }

      - name: Install (CPU torch -- the CUDA wheel is ~2.5 GB)
        run: |
          pip install --extra-index-url https://download.pytorch.org/whl/cpu \
            -r backend/inference/requirements.txt
          pip install -r backend/tests/requirements.txt
          # the sidecar's requirements pull in the GUI build for ultralytics' sake; a
          # runner has no display, and the two packages cannot coexist. They own the
          # same cv2/ directory, so uninstalling one deletes the other's files and the
          # reinstall below is then skipped as "already satisfied" -- leaving no cv2 at
          # all, which the sidecar only discovers at import time. --force-reinstall is
          # what puts the files back; the import is the proof it did.
          pip uninstall -y opencv-python
          pip install --force-reinstall --no-deps opencv-python-headless
          python -c "import cv2; print('cv2', cv2.__version__)"

      - name: Cache model weight
        id: cache-weight
        uses: actions/cache@v4
        with:
          path: ${{ env.MODELS_DIR }}/yoloe-11s-seg.pt
          key: yoloe-11s-seg

      # actions/cache only restores an existing cache -- it never fetches on a
      # miss (the first run, or an eviction). Ultralytics resolves this exact
      # filename to a download URL; running from inside MODELS_DIR makes it land
      # where both implementations look.
      - name: Download model weight (cache miss)
        if: steps.cache-weight.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$MODELS_DIR"
          cd "$MODELS_DIR" && python -c "from ultralytics import YOLOE; YOLOE('yoloe-11s-seg.pt')"

      # Prompt-bank bookkeeping (the model lock, the pre-FR-36 self-heal,
      # reembed's atomic commit). Needs torch but loads no checkpoint, so a
      # broken bank fails in seconds rather than after a full pass.
      - name: Bank unit checks
        run: python -m backend.tests.bank_test

      # The sidecar's streams must be produced on one thread, or the
      # per-checkpoint lock gets released by a thread that never took it and
      # stays held for the life of the process. Two overlapping passes is all it
      # takes, which nothing else here does -- the smoke test and the parity
      # differ both drive one call at a time.
      - name: Stream threading check
        run: python -m backend.tests.stream_test

      - name: Start the inference sidecar
        run: |
          uvicorn backend.inference.service:app --port 8001 --log-level warning \
            >/tmp/vpe.log 2>&1 &
          # /vpe/health loads no model, so this is up as soon as torch is imported; a
          # checkpoint is only loaded by the first request that needs one. Give up
          # loudly: a sidecar that never starts used to sail through this loop and
          # surface a step later as an unexplained 500 from the API.
          for _ in $(seq 1 60); do
            curl -fs http://127.0.0.1:8001/vpe/health && exit 0
            sleep 1
          done
          echo "the inference sidecar never became healthy:"; cat /tmp/vpe.log; exit 1

      - name: Start the API
        run: |
          (cd backend && go build -o /tmp/ctflow-api ./cmd/api)
          /tmp/ctflow-api >/tmp/api.log 2>&1 &
          for _ in $(seq 1 30); do
            curl -fs http://127.0.0.1:8000/api/config >/dev/null && exit 0
            sleep 1
          done
          echo "the API never became healthy:"; cat /tmp/api.log; exit 1

      # Drives the API over HTTP exactly as the browser does. The same command
      # ran against FastAPI throughout the port, which is what made "Go behaves
      # identically" checkable rather than asserted.
      - name: Smoke test
        env:
          SMOKE_BASE_URL: http://127.0.0.1:8000
        run: python -m backend.tests.smoke_test

      # Both services log to a file, and both are background processes whose
      # output no step would otherwise show. The API answers "internal error" by
      # design -- the reason only exists here.
      - name: Service logs
        if: failure()
        run: tail -n 100 /tmp/vpe.log /tmp/api.log
