# Build and push the three images that make up docker-compose.yml, to both
# ghcr.io and the company registry. The VM-side compose files that actually
# run these (deploy/) pull from container3.connectedtech.dev; ghcr.io stays
# around as a free public mirror. Nothing here touches the VM -- cr-watchtower
# (deploy/core) polls the registry and restarts containers on its own.
name: deploy

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # api/web have nothing to do with vpe's checkpoints failing to fetch
      matrix:
        include:
          - image: ct-flow-api
            dockerfile: backend/Dockerfile
          - image: ct-flow-vpe
            dockerfile: backend/inference/Dockerfile
          - image: ct-flow-web
            dockerfile: frontend/Dockerfile
    steps:
      - uses: actions/checkout@v4

      # GHCR rejects an uppercase owner; github.repository_owner keeps
      # whatever case the account was created with.
      - run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      # backend/inference/Dockerfile COPYs these three checkpoints into the
      # image (README.md#quick-start-docker) -- they're gitignored (*.pt),
      # so a clean checkout never has them. Same fetch a dev runs by hand
      # before their first `docker compose build`.
      - uses: actions/setup-python@v5
        if: matrix.image == 'ct-flow-vpe'
        with: { python-version: "3.12" }

      - uses: actions/cache@v4
        id: cache-weights
        if: matrix.image == 'ct-flow-vpe'
        with:
          path: models
          key: vpe-checkpoints-v1

      - name: Fetch baked-in checkpoints (cache miss)
        if: matrix.image == 'ct-flow-vpe' && steps.cache-weights.outputs.cache-hit != 'true'
        run: |
          pip install ultralytics
          mkdir -p models && cd models && python -c "
          from ultralytics import YOLOE
          for m in ('yoloe-11s-seg', 'yoloe-26s-seg', 'yoloe-26x-seg'): YOLOE(m + '.pt')"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Company registry -- deploy/ on the VM pulls from here, not ghcr.io.
      - uses: docker/login-action@v3
        with:
          registry: container3.connectedtech.dev
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/${{ env.OWNER }}/${{ matrix.image }}:${{ github.ref_name }}
            ghcr.io/${{ env.OWNER }}/${{ matrix.image }}:latest
            container3.connectedtech.dev/${{ matrix.image }}:${{ github.ref_name }}
            container3.connectedtech.dev/${{ matrix.image }}:latest
