# Dev convenience, loaded automatically by `docker compose up` alongside
# docker-compose.yml (no -f flag needed). Bind-mounts backend/ over the sidecar
# image and turns on uvicorn --reload, publishes the API and the database for
# tooling that runs on the host, and adds a database browser.
# Don't want this? `docker compose -f docker-compose.yml up` skips it.
#
# The Go service is not reloaded: it compiles in a couple of seconds, so
# `docker compose up -d --build api` is the whole loop.
services:
  # A reload here drops every loaded checkpoint, so the next request pays the
  # cold start again. Editing API code no longer triggers that, which is half
  # the point of the split.
  vpe:
    volumes:
      - ./backend:/app/backend
    command: ["uvicorn", "backend.inference.service:app", "--host", "0.0.0.0", "--port", "8001", "--reload"]

  api:
    # Published so the smoke test, curl and the API docs' examples can reach it
    # from the host. Not published in production, where only `web` needs it.
    ports:
      - "${API_PORT:-8000}:8000"

  db:
    # Published for the parity harness (backend/_parity.py, _smoke_test.py's
    # DB assertions) and adminer -- both run on the host, not in a container.
    # 5433 by default because a distro postgres commonly already holds 5432.
    ports:
      - "${DB_PORT:-5433}:5432"

  # Click-around DB browser -- no SQL needed. http://localhost:8080, system
  # "PostgreSQL", server "db", user/pass/db from POSTGRES_PASSWORD in .env.
  adminer:
    image: adminer
    ports:
      - "8080:8080"
    depends_on:
      - db
