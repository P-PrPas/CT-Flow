services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: labeltool
      POSTGRES_USER: labeltool
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U labeltool"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Inference sidecar: YOLOE + the prompt bank (docs/REFACTOR_PLAN.md). Split
  # out of `api` so the API service carries no torch, and so the two can be
  # rebuilt and restarted independently -- reloading an API change no longer
  # means re-loading a checkpoint.
  #
  # Not published to the host, and it must stay that way: it trusts its caller
  # to have run every path through checked_path() already.
  vpe:
    build:
      context: .                       # needs certs/ too
      dockerfile: backend/Dockerfile.vpe
      args:
        APP_UID: ${APP_UID:-1000}      # must match api's -- both write under DATA_DIR
    image: ct-flow-vpe
    environment:
      LABEL_TOOL_MODE: vm
      LABEL_TOOL_VM_ROOT: /opt/mount/project
    volumes:
      # It reads the images it embeds, and owns <input_dir>/.ctflow/_bank/
      # outright -- no other process writes there.
      - ${DATA_DIR:-../data}:/opt/mount/project
      # YOLOE checkpoints, auto-downloaded on first use per selected model
      # (see backend/services/models.py) -- named so a restart doesn't
      # re-fetch every weight from scratch.
      - models:/models
    # Requires an NVIDIA GPU + driver + the NVIDIA Container Toolkit on the
    # host (`docker info` should list an `nvidia` runtime). No GPU available?
    # Delete this block and rebuild with TORCH_INDEX_URL=.../whl/cpu instead
    # (see backend/Dockerfile.vpe) -- inference still runs, just on CPU.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

  # The FastAPI service, now behind the Go one. Every route Go has not taken
  # over yet is proxied here (see cmd/api/main.go). It shrinks with each
  # group ported and goes away entirely at the end of the port.
  legacy:
    build:
      context: .                       # this repo's root
      dockerfile: backend/Dockerfile
      args:
        APP_UID: ${APP_UID:-1000}      # must own DATA_DIR on a Linux host
    image: ct-flow-legacy
    environment:
      LABEL_TOOL_MODE: vm              # in a container the FS is always "the vm"
      LABEL_TOOL_VM_ROOT: /opt/mount/project
      # Empty = no login and no upload (single trusted user). Fill both in to
      # turn the tool multi-user -- see .env.example.
      LABEL_TOOL_USERS: ${LABEL_TOOL_USERS:-}
      LABEL_TOOL_SECRET: ${LABEL_TOOL_SECRET:-}
      LABEL_TOOL_MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-25}
      # T-21: label/box storage. The prompt bank (embeddings) is unaffected --
      # still the file under each project's .ctflow/_bank/. See
      # docs/DB_MIGRATION_PLAN.md.
      DATABASE_URL: postgresql://labeltool:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/labeltool
      VPE_URL: http://vpe:8001
    depends_on:
      db:
        condition: service_healthy
      vpe:
        condition: service_healthy
    volumes:
      # Everything the tool can see. Each project's labels/bank/test-set data
      # live in a .ctflow/ subfolder next to its own images, all still under
      # here -- the browser can only ever pick paths inside /opt/mount/project.
      - ${DATA_DIR:-../data}:/opt/mount/project
      # Read-only: services/models.py::is_available() only stats this to tell
      # the frontend which checkpoints are already cached. `vpe` is the one
      # that downloads into it, and the one whose image seeds it -- a brand-new
      # named volume is populated from the image of the container that mounts
      # it first, and this image has nothing at /models. depends_on above is
      # what guarantees `vpe` gets there first; don't drop it to speed up boot.
      - models:/models:ro
    restart: unless-stopped

  # The Go API service. Fronts everything: the browser reaches this, and it
  # either answers or proxies to `legacy`.
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
      args:
        APP_UID: ${APP_UID:-1000}
    image: ct-flow-api
    environment:
      LABEL_TOOL_MODE: vm
      LABEL_TOOL_VM_ROOT: /opt/mount/project
      LABEL_TOOL_USERS: ${LABEL_TOOL_USERS:-}
      # Both services verify the session cookie, so they have to sign it with
      # the same key -- a login served by one and a request proxied to the
      # other must agree. Leaving this unset gives each process its own random
      # secret and every proxied request 401s.
      LABEL_TOOL_SECRET: ${LABEL_TOOL_SECRET:-}
      LABEL_TOOL_MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-25}
      LEGACY_URL: http://legacy:8000
    depends_on:
      legacy:
        condition: service_healthy
    volumes:
      - ${DATA_DIR:-../data}:/opt/mount/project
      # Read-only: only to report which checkpoints are already cached.
      - models:/models:ro
    ports:
      - "${API_PORT:-8000}:8000"
    restart: unless-stopped

  web:
    build:
      context: .                       # needs certs/ too
      dockerfile: frontend/Dockerfile
    image: ct-flow-web
    environment:
      API_URL: http://api:8000         # consumed by next.config.ts rewrites
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  models:
  pgdata:
